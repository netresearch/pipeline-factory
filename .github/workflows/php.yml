name: PHP Composer

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

permissions: {}

jobs:
    # The Symfony dimension is a matrix axis inside the shared reusable
    # (`extra-matrix`), not one caller job per major. Each cell exports its
    # value as MATRIX_SYMFONY, which `symfony-require` resolves at runtime.
    #
    # `symfony-require` installs symfony/flex and exports SYMFONY_REQUIRE, so
    # the WHOLE Symfony stack is pinned to the cell's major, transitive
    # symfony/* packages included. The previous `pre-install-cmd` pinned
    # exactly the three direct dependencies by name: a fourth Symfony
    # dependency added to composer.json later would have resolved to whatever
    # version happened to fit, and the matrix would have kept claiming a
    # coverage it no longer had.
    symfony:
        uses: netresearch/.github/.github/workflows/php-ci.yml@main
        permissions:
            contents: read
        with:
            php-versions: '["8.2","8.3","8.4"]'
            extra-matrix: '[{"symfony":"5.4.*"},{"symfony":"6.4.*"},{"symfony":"7.4.*"}]'
            symfony-require: MATRIX_SYMFONY
            phpstan-cmd: composer phpstan
            phpunit-cmd: composer test
            run-cs-fixer: true
            cs-fixer-cmd: composer phpcs
            run-rector: true
            rector-cmd: composer rector -- --dry-run --no-progress-bar

    # Symfony 8.0 requires PHP 8.4+, so it cannot join the matrix above: the
    # 8.0 x PHP 8.2 and 8.0 x PHP 8.3 cells are unresolvable. That is a
    # constraint of the dependency, not a local preference, so it stays a
    # separate job until the reusable can express matrix exclusions
    # (netresearch/.github#287).
    symfony-8:
        uses: netresearch/.github/.github/workflows/php-ci.yml@main
        permissions:
            contents: read
        with:
            php-versions: '["8.4"]'
            extra-matrix: '[{"symfony":"8.0.*"}]'
            symfony-require: MATRIX_SYMFONY
            phpstan-cmd: composer phpstan
            phpunit-cmd: composer test
            run-cs-fixer: true
            cs-fixer-cmd: composer phpcs
            run-rector: true
            rector-cmd: composer rector -- --dry-run --no-progress-bar

    # Unpinned (highest resolvable Symfony for PHP 8.3) run with xdebug,
    # producing the HTML/text report documented in the README.
    code-coverage:
        name: Code Coverage
        uses: netresearch/.github/.github/workflows/php-ci.yml@main
        permissions:
            contents: read
        with:
            php-versions: '["8.3"]'
            coverage: xdebug
            run-phpstan: false
            phpunit-cmd: composer test-coverage
