name: PHP Composer

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

permissions: {}

jobs:
    # One caller job per supported Symfony major. The shared `php-ci.yml`
    # matrices over PHP only, so the Symfony dimension is expressed as
    # separate jobs that pin the three direct Symfony dependencies via
    # `pre-install-cmd` before `composer install` resolves.
    symfony-5-4:
        name: Symfony 5.4
        uses: netresearch/.github/.github/workflows/php-ci.yml@main
        permissions:
            contents: read
        with:
            php-versions: '["8.2","8.3","8.4"]'
            pre-install-cmd: 'composer require --no-update --no-progress "symfony/dependency-injection:5.4.*" "symfony/config:5.4.*" "symfony/http-kernel:5.4.*"'
            phpstan-cmd: composer phpstan
            phpunit-cmd: composer test
            run-cs-fixer: true
            cs-fixer-cmd: composer phpcs
            run-rector: true
            rector-cmd: composer rector -- --dry-run --no-progress-bar

    symfony-6-4:
        name: Symfony 6.4
        uses: netresearch/.github/.github/workflows/php-ci.yml@main
        permissions:
            contents: read
        with:
            php-versions: '["8.2","8.3","8.4"]'
            pre-install-cmd: 'composer require --no-update --no-progress "symfony/dependency-injection:6.4.*" "symfony/config:6.4.*" "symfony/http-kernel:6.4.*"'
            phpstan-cmd: composer phpstan
            phpunit-cmd: composer test
            run-cs-fixer: true
            cs-fixer-cmd: composer phpcs
            run-rector: true
            rector-cmd: composer rector -- --dry-run --no-progress-bar

    symfony-7-4:
        name: Symfony 7.4
        uses: netresearch/.github/.github/workflows/php-ci.yml@main
        permissions:
            contents: read
        with:
            php-versions: '["8.2","8.3","8.4"]'
            pre-install-cmd: 'composer require --no-update --no-progress "symfony/dependency-injection:7.4.*" "symfony/config:7.4.*" "symfony/http-kernel:7.4.*"'
            phpstan-cmd: composer phpstan
            phpunit-cmd: composer test
            run-cs-fixer: true
            cs-fixer-cmd: composer phpcs
            run-rector: true
            rector-cmd: composer rector -- --dry-run --no-progress-bar

    # Symfony 8.0 requires PHP 8.4+, so this job carries no 8.2/8.3 entries.
    symfony-8-0:
        name: Symfony 8.0
        uses: netresearch/.github/.github/workflows/php-ci.yml@main
        permissions:
            contents: read
        with:
            php-versions: '["8.4"]'
            pre-install-cmd: 'composer require --no-update --no-progress "symfony/dependency-injection:8.0.*" "symfony/config:8.0.*" "symfony/http-kernel:8.0.*"'
            phpstan-cmd: composer phpstan
            phpunit-cmd: composer test
            run-cs-fixer: true
            cs-fixer-cmd: composer phpcs
            run-rector: true
            rector-cmd: composer rector -- --dry-run --no-progress-bar

    # Unpinned (highest resolvable Symfony for PHP 8.3) run with xdebug,
    # producing the HTML/text report documented in the README.
    code-coverage:
        name: Code Coverage
        uses: netresearch/.github/.github/workflows/php-ci.yml@main
        permissions:
            contents: read
        with:
            php-versions: '["8.3"]'
            coverage: xdebug
            run-phpstan: false
            phpunit-cmd: composer test-coverage
